[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 61.0.0", "versioneer[toml]==0.29"]

[project]
name = "access_py_telemetry"
description = "Contains ipython extensions to automatically add telemetry to registered function calls from Ipython kernels"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ACCESS-NRI" }]
maintainers = [{ name = "ACCESS-NRI" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
license = { text = "Apache Software License 2.0" }
dependencies = [
    "ipython>=7.0.0",
    "libcst",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.28.0",
]

dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "coverage",          # testing
    "mypy",              # linting
    "pytest>=9.0.3",     # testing
    "ruff",              # linting
    "pytest-httpserver", # #Endpoints for testing.
    "intake",
    "access-nri-intake",
    "numpy",
]
docs = ["sphinx>=7", "myst-parser", "sphinx-rtd-theme"]

[project.scripts]
access-py-telemetry = "access_py_telemetry.cli:configure_telemetry"

[project.urls]

bugs = "https://github.com/ACCESS-NRI/access-py-telemetry/issues"
changelog = "https://github.com/ACCESS-NRI/access-py-telemetry/blob/main/CHANGELOG.md"
homepage = "https://github.com/ACCESS-NRI/access-py-telemetry"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
"*" = ["*.*"]


# Mypy
# ----

[tool.mypy]
files = "src"
exclude = ["src/access_py_telemetry/_version.py"]

# Use strict defaults
strict = true
warn_unreachable = true
# warn_unused_ignores = true
warn_no_return = true

allow_subclassing_any = true

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "src/access_py_telemetry/_version.py"
versionfile_build = "access_py_telemetry/_version.py"
tag_prefix = "v"
parentdir_prefix = "access-py-telemetry"

[tool.coverage.run]
omit = ["*/_version.py", "*/data/__init__.py"]

[tool.ruff]
target-version = "py310"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
# E402: module level import not at top of file
# E501: line too long - let black worry about that
ignore = ["E402", "E501"]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I",
    # Pyupgrade
    "UP",
]

[tool.ruff.mccabe]
max-complexity = 18

[tool.ruff.isort]
known-first-party = ["access_py_telemetry"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.feature.dev.pypi-dependencies]
access_py_telemetry = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
test-py310 = { features = ["py310", "test"] }
test-py311 = { features = ["py311", "test"] }
test-py312 = { features = ["py312", "test"] }
test-py313 = { features = ["py313", "test"] }
test-py314 = { features = ["py314", "test"] }

[tool.pixi.feature.dev.dependencies]
pre-commit = ">=4.2.0,<5"
pytest = ">=9.0.3"

[tool.pixi.feature.dev.tasks]
mypy-setup = { cmd = "pixi run mypy --install-types", description = "Install mypy type stubs" }
pre-commit-install = { cmd = "pixi run pre-commit install", description = "Install pre-commit hooks" }
pre-commit = { cmd = "pre-commit run --all-files && pixi lock", description = "Run pre-commit hooks" }
dump-conda-env = { cmd = "pixi workspace export conda-environment --name access-py-telemetry-test > env.yml", description = "Dump conda environment to env.yml" }

[tool.pixi.feature.test.pypi-dependencies]
access_py_telemetry = { path = ".", editable = false }
access-nri-intake = ">=1.5.0, <2"
pytest-random-order = ">=1.2.0, <2"

[tool.pixi.feature.test.dependencies]
pytest = ">=8.4.1,<9"
pytest-ordering = ">=0.6,<0.7"
coverage = "*"
pytest-httpserver = ">=1.1.5,<2"
pytest-asyncio = ">=1.4.0,<2"
pandas = ">=2.3.3,<4"
numpy = ">=2.2.6,<3"
intake = ">=2.0.9,<3"

[tool.pixi.feature.test.tasks]
test = { cmd = "pytest --random-order tests", description = "Run tests" }
test-cov = { cmd = "coverage run -m --source=access_py_telemetry pytest --random-order tests && coverage xml", description = "Run tests with coverage and generate xml report" }

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.tasks]
