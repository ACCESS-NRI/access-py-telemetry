# Telemetry configuration.
#
# Two sections:
#   registries:  the registered call names, grouped by service. This is the source
#                of truth for ENDPOINTS / REGISTRIES (see utils.py) and is walked by
#                build_endpoints exactly as the whole file used to be.
#   transitions: the type-flow knowledge the AST interpreter uses to resolve chained
#                calls (see ast.py). A registered method's successor node type defaults
#                to *self* (the same node), so only type-*changing* edges and the
#                generators that mint a node from a module path / factory are listed here.

registries:
  intake:
    catalog:
      - esm_datastore.search
      - DfFileCatalog.search
      - DfFileCatalog.__getitem__
      - esm_datastore.to_dataset_dict
      - esm_datastore.to_dask
      - esm_datastore.df
      - DfFileCatalog.df
      - esm_datastore.unique
      - esm_datastore.nunique
      - DfFileCatalog.unique
      - DfFileCatalog.nunique
      - DfFileCatalog.keys
      - DfFileCatalog.to_source_dict
      - DfFileCatalog.to_source
      - intake.cat.access_nri
      - AliasedESMCatalog.search
      - AliasedDataframeCatalog.search
      - AliasedDataframeCatalog.__getitem__
      - AliasedESMCatalog.to_dataset_dict
      - AliasedESMCatalog.to_dask
      - AliasedESMCatalog.df
      - AliasedDataframeCatalog.df
      - AliasedESMCatalog.unique
      - AliasedESMCatalog.nunique
      - AliasedDataframeCatalog.unique
      - AliasedDataframeCatalog.nunique
      - AliasedDataframeCatalog.keys
      - AliasedDataframeCatalog.to_source_dict
      - AliasedDataframeCatalog.to_source
    datastore:
      - use_datastore
      - open_esm_datastore
      - BaseBuilder.build
      - BaseBuilder.save
      - AccessOm2Builder.build
      - AccessOm2Builder.save
      - AccessOm3Builder.build
      - AccessOm3Builder.save
      - AccessCm2Builder.build
      - AccessCm2Builder.save
      - Mom6Builder.build
      - Mom6Builder.save
      - AccessEsm15Builder.build
      - AccessEsm15Builder.save
      - AccessCm2Builder.build
      - AccessCm2Builder.save
      - ROMSBuilder.build
      - ROMSBuilder.save
    cli:
      - metadata_validate
      - metadata_template
      - use_esm_datatore

transitions:
  # Source patterns that mint a node from a module path or factory function.
  # (Constructors `ClassName(...)` are handled implicitly by the interpreter and
  # need no entry here.)
  generators:
    intake.cat.access_nri: DfFileCatalog
    open_esm_datastore: esm_datastore

  # Method edges that CHANGE the node type. Anything registered but not listed here
  # defaults to returning *self*, which is correct for `.search(...)` chains and
  # harmless for terminal methods (`.to_dask()` etc.) whose result carries no
  # registered methods.
  overrides:
    DfFileCatalog:
      __getitem__: esm_datastore
    AliasedDataframeCatalog:
      __getitem__: AliasedESMCatalog
